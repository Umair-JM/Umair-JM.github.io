<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook, Umair Javaid Manj</title>
  <meta name="description" content="Leave a message for Umair Javaid Manj." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&f[]=zodiak@400,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <button id="modeToggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </header>

    <div class="subhead">
      <h1>Guestbook</h1>
      <p>Say hi, leave feedback, or drop a note. Messages are stored locally in your browser.</p>
    </div>

    <form class="gb-form" id="gbForm" autocomplete="off">
      <input type="text" name="name" placeholder="Your name" maxlength="40" required />
      <textarea name="text" placeholder="Your message" maxlength="280" required></textarea>
      <button type="submit" class="book-btn">Sign the guestbook</button>
    </form>

    <div id="gbList"></div>

    <footer class="footer">
      <div class="footer-meta">
        <span>© <span id="year"></span> Umair Javaid Manj</span>
        <a class="alink" href="index.html">Home</a>
      </div>
    </footer>
  </main>
</body>
</html>
